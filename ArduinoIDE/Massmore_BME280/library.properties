sentence=ไลบรารีสำหรับเซ็นเซอร์สภาพแวดล้อม Bosch BME280 วัดอุณหภูมิ ความชื้นสัมพัทธ์ ความดันบรรยากาศ และคำนวณความสูง
paragraph=เขียนจากดาต้าชีต BST-BME280-DS002 โดยตรง ใช้สูตรชดเชยแบบจำนวนเต็มตามที่ Bosch กำหนด รองรับ oversampling x1 ถึง x16 แยกรายช่อง โหมด sleep/forced/normal ฟิลเตอร์ IIR เวลาพักระหว่างรอบ อ่านค่าดิบ ADC และค่าชดเชยทั้ง 32 ตัว มีโหมดไม่บล็อก ไม่ใช้ heap และมี verifyChip() ตรวจ 10 ข้อว่าเป็นชิป Bosch ของแท้ แยก BMP280 (0x58) ออกจาก BME280 (0x60) ได้ชัดเจน พร้อมตัวอย่าง 10 ชุดและชุดทดสอบโรงงาน สำหรับบอร์ด Massmore BME280 SKU-1023
