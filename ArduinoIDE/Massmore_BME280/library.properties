sentence=ไลบรารี Massmore สำหรับเซ็นเซอร์ Bosch BME280 (I2C/SPI) วัดอุณหภูมิ ความชื้นสัมพัทธ์ ความดันบรรยากาศ และคำนวณความสูง รองรับ ESP32 / ESP32-S3 / RP2040 / STM32 / AVR
paragraph=เขียนจากดาต้าชีต BST-BME280-DS002 โดยตรง ใช้สูตรชดเชยแบบจำนวนเต็มตามที่ Bosch กำหนด รองรับทั้ง I2C (0x77/0x76) และ SPI 4 สาย ไม่ init บัสเอง (sketch เลือกขาได้อิสระ) ไม่ใช้ heap มี API แบบง่าย (บล็อก) และ FSM ไม่บล็อก requestConversion/update/isDataReady/getReadings มี verifyChip() ตรวจ 10 ข้อว่าเป็นชิป Bosch ของแท้ แยก BMP280 (0x58) ออกจาก BME280 (0x60) พร้อมตัวอย่าง 7 ชุดและชุดทดสอบโรงงาน 07_Factory_Test สำหรับบอร์ด Massmore BME280 SKU-1023
