; ============================================================================
;  Massmore BME280 (SKU-1023) - โปรเจกต์ PlatformIO
;  https://www.massmore.shop
;
;  วิธีใช้
;    1. เปิดโฟลเดอร์ PlatformIO/ นี้ด้วย VS Code (ต้องมีส่วนขยาย PlatformIO IDE)
;    2. เลือกตัวอย่างที่ต้องการจาก examples/ แล้วคัดลอกทับ src/main.cpp
;    3. เลือก env ให้ตรงบอร์ด แล้วกด Upload  เช่น  pio run -e esp32-s3-devkitc-1 -t upload
;
;  ไลบรารีอยู่ใน lib/Massmore_BME280/ PlatformIO หาเจอเอง ไม่ต้องตั้งค่าเพิ่ม
;  ไม่มี dependency ภายนอก (ใช้แค่ Wire / SPI ที่มากับ core)
;
;  ESP32 core : platform "espressif32" ตัวทางการยังส่ง Arduino core 2.0.x อยู่
;  จึงใช้ pioarduino fork ที่ pin ไว้ตายตัวเพื่อให้ได้ core 3.x ตามมาตรฐาน Massmore
;    55.03.311  =  Arduino ESP32 core 3.3.11  (ฐาน ESP-IDF v5.x)
; ============================================================================

[platformio]
default_envs = esp32-s3-devkitc-1, esp32dev, pico, uno
src_dir = src
include_dir = include

; ค่าที่ทุก env ใช้ร่วมกัน
[env]
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra
lib_deps =

; ---------------------------------------------------------------------------
;  ESP32 family  (Arduino-ESP32 core 3.x ผ่าน pioarduino)
; ---------------------------------------------------------------------------
[esp32_base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
; 512000 คือค่าที่ใช้กับบอร์ด Massmore บน macOS ได้นิ่งที่สุด
; ถ้าอัปโหลดไม่ผ่าน (Timed out waiting for packet header) ให้ลด 460800 หรือ 115200
upload_speed = 512000

[env:esp32-s3-devkitc-1]
extends = esp32_base
board = esp32-s3-devkitc-1
; ESP32-S3 มี USB-CDC ในตัว : เปิดให้ Serial ออกทาง USB port
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32dev]
extends = esp32_base
board = esp32dev

; ---------------------------------------------------------------------------
;  RP2040  (Raspberry Pi Pico - Arduino-Pico core ของ Earle Philhower)
; ---------------------------------------------------------------------------
[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
board_build.core = earlephilhower

; ---------------------------------------------------------------------------
;  AVR ATmega328P  (Arduino Uno / Nano - SRAM 2 KB ใช้ Simple API เป็นหลัก)
; ---------------------------------------------------------------------------
[env:uno]
platform = atmelavr
board = uno

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
; Nano รุ่นเก่า bootloader เดิมใช้ 57600 ถ้าอัปโหลดไม่ผ่านให้เปลี่ยน board = nanoatmega328new
